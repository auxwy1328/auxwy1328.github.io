[related]
  threshold = 80
  includeNewer = true
  toLower = false
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80

[permalinks]
  posts = "/:sections/:slug/"

[taxonomies]
  tag = "tags"
  category = "categories"
