baseURL = "https://chatjiami.com/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "加密聊客"
relativeURLs = false

[sitemap]
  changefreq = "weekly"
  priority = 0.8
  filename = "sitemap.xml"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]


[security]
  [security.exec]
    allow = ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$']
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']
  [security.http]
    methods = ['(?i)GET|POST']
    urls = ['.*']

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "dracula"

[params]
  ogImage = "/images/og-home.jpg"
  homepage_title = "加密聊天软件推荐 - 2026年最安全的加密通讯工具评测与教程"
  description = "加密聊客专注加密聊天软件评测与使用教程，深度对比Signal、蝙蝠聊天、Telegram、Session、Threema等20+款加密通讯工具的端到端加密、匿名注册、阅后即焚等核心功能，帮你找到最安全、最适合的私密通讯方案。"
  author = "加密聊客"
  keywords = "加密聊天软件,加密通讯,端到端加密,匿名聊天,加密聊客,Signal教程,Telegram私密,阅后即焚"

