<section class="hero">
  <div class="hero-in">
    <div class="hero-badge">🛡️ 2026 持续更新 · 31 个关键词深度覆盖</div>
    <h1>找到最安全的<em>加密聊天</em>方案</h1>
    <p>全球 20+ 款加密通讯工具的深度评测与使用教程。端到端加密、匿名通讯、阅后即焚——保护你的每一次对话。</p>
    <div class="hero-search">
      <input type="text" placeholder="搜索加密聊天软件、教程、功能...">
      <button>搜索</button>
    </div>
    {{ if .Site.Params.cpa.enabled }}
    <div class="dl-hero-grid">
      {{ range first 4 .Site.Params.cpa.apps }}
      <a href="{{ .android_url }}" class="dl-hero-item" target="_blank" rel="noopener sponsored">
        <span class="dl-hero-icon">{{ .icon }}</span>
        <span class="dl-hero-name">{{ .name }}</span>
        <span class="dl-hero-dl">免费下载</span>
      </a>
      {{ end }}
    </div>
    {{ end }}
    <div class="hero-stats">
      <div><div class="n">31</div><div class="l">优化关键词</div></div>
      <div><div class="n">15+</div><div class="l">软件评测</div></div>
      <div><div class="n">10K+</div><div class="l">月搜索覆盖</div></div>
    </div>
  </div>
</section>
